version: "3.8"

services:
  image-to-sketch:
    image: 150619449649.dkr.ecr.ap-south-1.amazonaws.com/image-to-sketch:latest

    container_name: image-to-sketch

    restart: unless-stopped

    ports:
      - "4000:4000"

    env_file:
      - .env

    volumes:
      - uploads-data:/app/static/uploads

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  uploads-data: